id: no-hardcoded-secret
language: JavaScript
message: "Possible hardcoded secret — use environment variables instead"
severity: warning
rule:
  any:
    - pattern: |
        const $NAME = "$VALUE"
      where:
        $NAME:
          regex: (?i)(api_?key|secret|password|token|auth|credential)
        $VALUE:
          regex: ^[A-Za-z0-9_\-]{16,}$
    - pattern: |
        "$KEY": "$VALUE"
      where:
        $KEY:
          regex: (?i)(api_?key|secret|password|token|auth|credential)
        $VALUE:
          regex: ^[A-Za-z0-9_\-]{16,}$
